spring.application.name=HospitalManagementSystem

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/NewHospitalManagement
spring.datasource.username=postgres
spring.datasource.password=java

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
jwt.refresh_expiry = ${JWT_REFRESH_EXPIRY}

spring.data.redis.host=localhost
spring.data.redis.port=6379

capacity: 4
refill-period-minutes: 1

spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.model=openai/gpt-oss-120b

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.model=nomic-embed-text

spring.ai.model.embedding=ollama
spring.ai.vectorstore.pgvector.initialize-schema=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=false
spring.flyway.clean-disabled=true